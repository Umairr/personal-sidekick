[project]
name = "personal-sidekick"
version = "0.1.0"
description = "A personal AI co-worker built on LangChain create_agent + LangGraph, with a real browser, human-in-the-loop approvals and a custom web UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.2.2",
    "langgraph>=1.2.4",
    "langsmith>=0.8.11",
    "pydantic>=2.13",
    "python-dotenv>=1.2.2",
    "requests>=2.32",
    "wikipedia>=1.4.0",
    "langchain-anthropic>=1.7.10",
]

[project.optional-dependencies]
google = [
    "langchain-google-genai>=4.5.0",
]
ollama = [
    "langchain-ollama>=1.1.0",
]
groq = [
    "langchain-groq>=1.1.3",
]
